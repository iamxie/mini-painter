# 建置、跑測試、打包；推 v* 標籤時自動開 GitHub Release 並掛上發佈包與 7-Zip 原始碼包。
# 建置參數在 CMakePresets.json 的 release preset，和 scripts/vm-build.cmd 用同一個：MSVC + Ninja + vcpkg manifest
# （x64-windows-static，/MT）。7z.dll 照 scripts/7zip.lock 下載官方安裝檔抽出並核對 hash。
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read   # 只有下面的 release job 要寫權限

env:
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-cache

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60   # vcpkg 沒有快取時約 20 分鐘；測試卡住時不要等到預設的 6 小時
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      # vcpkg 用哪個 commit 只寫在 vcpkg.json 的 builtin-baseline：這裡讀出來，下面的 checkout 與快取的 key 都用它。
      - name: Read the pinned vcpkg commit
        shell: pwsh
        run: |
          $commit = (Get-Content vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'
          if ($commit -notmatch '^[0-9a-f]{40}$') { throw "vcpkg.json builtin-baseline is not a commit hash: $commit" }
          "VCPKG_COMMIT=$commit" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Checkout vcpkg (pinned)
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: ${{ env.VCPKG_COMMIT }}
          path: vcpkg

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-${{ env.VCPKG_COMMIT }}-

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          .\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Fetch 7z.dll (per scripts/7zip.lock)
        shell: pwsh
        run: |
          $lock = @{}
          Get-Content scripts/7zip.lock | ForEach-Object {
            if ($_ -match '^\s*([A-Za-z0-9_]+)=(.*)$') { $lock[$Matches[1]] = $Matches[2].Trim() }
          }
          New-Item -ItemType Directory -Force 7zip-dl, 7zip | Out-Null
          $inst = "7zip-dl\" + (Split-Path -Leaf $lock.installer_url)
          Invoke-WebRequest -Uri $lock.installer_url -OutFile $inst
          $h = (Get-FileHash $inst -Algorithm SHA256).Hash.ToLower()
          if ($h -ne $lock.installer_sha256) { throw "installer hash mismatch: $h" }
          # 安裝檔是 7z 自解壓檔，runner 內建的 7-Zip 可以直接抽出 7z.dll
          & "C:\Program Files\7-Zip\7z.exe" x $inst -o7zip 7z.dll -y | Out-Null
          $h = (Get-FileHash 7zip\7z.dll -Algorithm SHA256).Hash.ToLower()
          if ($h -ne $lock.dll_sha256) { throw "7z.dll hash mismatch: $h" }
          $src = "7zip-dl\" + (Split-Path -Leaf $lock.src_url)
          Invoke-WebRequest -Uri $lock.src_url -OutFile $src
          $h = (Get-FileHash $src -Algorithm SHA256).Hash.ToLower()
          if ($h -ne $lock.src_sha256) { throw "source archive hash mismatch: $h" }
          "SEVENZIP_SRC=$src" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # configure 階段會檢查 vcpkg.json 的 version-string 等於 project(VERSION)。
      # VCPKG_ROOT 要在這一步指定：MSVC 環境會把它設成 Visual Studio 內附的 vcpkg。
      - name: Configure
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
          MP_7Z_DLL: ${{ github.workspace }}/7zip/7z.dll
        run: cmake --preset release

      - name: Build
        run: cmake --build --preset release

      - name: Test
        run: ctest --preset release

      - name: Language tables cover every string
        shell: pwsh
        run: python scripts/lang_check.py

      - name: Version
        id: ver
        shell: pwsh
        run: |
          $m = Select-String -Path CMakeLists.txt -Pattern 'project\(mpainter VERSION ([0-9.]+)'
          $ver = $m.Matches[0].Groups[1].Value
          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
            if ($tag -ne "v$ver") { throw "tag $tag does not match project(VERSION $ver) in CMakeLists.txt" }
          }
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Package
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          $dir = "dist\mini-painter-$ver-win64"
          New-Item -ItemType Directory -Force "$dir\lang" | Out-Null
          Copy-Item build\mpainter.exe, 7zip\7z.dll $dir
          # 根目錄的檔案照 scripts/package-files.txt（scripts/package.sh 讀同一份）；語系檔是 src/lang 的每個 .txt（_ 開頭的是範本，不放）。
          $files = @(Get-Content scripts\package-files.txt | ForEach-Object { $_.Trim() } | Where-Object { $_ -and -not $_.StartsWith('#') })
          if ($files.Count -eq 0) { throw "scripts/package-files.txt lists no files" }
          Copy-Item $files $dir
          $langs = @(Get-ChildItem src\lang\*.txt | Where-Object { -not $_.Name.StartsWith('_') })
          if ($langs.Count -eq 0) { throw "no language files in src/lang" }
          Copy-Item $langs.FullName "$dir\lang"
          Compress-Archive -Path "$dir\*" -DestinationPath "dist\mini-painter-$ver-win64.zip"
          # 自動更新下載後核對用（sha256sum 格式，UTF-8 無 BOM）
          $h = (Get-FileHash "dist\mini-painter-$ver-win64.zip" -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("$PWD\dist\mini-painter-$ver-win64.zip.sha256", "$h  mini-painter-$ver-win64.zip`n")
          Copy-Item $env:SEVENZIP_SRC dist\
          Get-ChildItem dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mini-painter-${{ steps.ver.outputs.version }}-win64
          path: |
            dist/*.zip
            dist/*.zip.sha256
            dist/*.7z

  # 推 v0.6.0 這類標籤時：開 release，掛發佈包 zip、它的 .sha256（自動更新用）與 7-Zip 原始碼包（LGPL §4：原始碼與二進位同一處）。
  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: mini-painter-${{ needs.build.outputs.version }}-win64
          path: dist

      - name: Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ver = "${{ needs.build.outputs.version }}"
          $zip = "dist\mini-painter-$ver-win64.zip"
          $src = @(Get-ChildItem dist\*.7z)
          if (-not (Test-Path $zip) -or -not (Test-Path "$zip.sha256") -or $src.Count -ne 1) { Get-ChildItem dist; throw "package files are missing" }
          gh release create "${{ github.ref_name }}" $zip "$zip.sha256" $src[0].FullName `
            --title "mini-painter $ver" --generate-notes
